- aid: monoova:monoova-payid-api
  name: Monoova Pay ID API
  description: >-
    <h3>  Overview </h3> <p> A PayID is an alias for a bank account number that makes paying into account
    easier. A PayID can be an email address, phone number or ABN. PayIDs are issued and associated with
    our <a href="/payments#tag/Automatcher-(Bank-Account-Receivables)"> /receivables </a>  bank accounts
    to allow your users a simpler way of sending you money. Once a PayID has been registered against a
    bank account, when a payment is made to that ID, the funds will arrive in your receivables account
    number. Currently we only support email PayIDs via the API. </p>
