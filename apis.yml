- aid: monoova:monoova-security-api
  name: Monoova Security API
  description: >-
    <h3>  Overview </h3> <p> The security/v1 APIs allows you to manage security tokens. This gives you
    an alternative to using signIn API KEY for BASIC authentication for each API call. Security tokens
    come in two forms </p> <ul> <li> <strong> OneShotSecurityToken </strong> </li> <li> <strong> SecurityToken
    </strong> </li> </ul> <p> The two security tokens operate in exactly the same way. The token is used
    to replace your UserName when configuring BASIC Authentication. Should you provide a password anyway,
    it will be ignored. Each token type has an expiry time between 1 and 15 minutes. The expiry time cannot
    be extended. </p> <p> As the name implies, a OneShotSecurityToken can only be used once. The token
    is deleted on its first use or when it expires, whatever is sooner. </p> <p> A SecurityToken can be
    used multiple times until it expires. The expiry time of a SecurityToken can be extended. </p> <p>
    Please note that security tokens discussed in this section have nothing in common with the token/v1
    APIs described elsewhere in this document. Security tokens provide secure sign-in from a web page;
    token/v1 APIs tokenize sensitive information. </p>
  humanURL: https://developer.monoova.com/overview
  baseURL: https://api.mpay.com.au
  tags:
  - Security
  properties:
  - type: OpenAPI
    url: openapi/monoova-security-api-openapi.yml
