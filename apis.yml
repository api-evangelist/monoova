name: Monoova
kind: company
description: 'Monoova is an Australian payments platform that lets businesses receive, manage, and pay
  funds in AUD across every domestic rail through a single set of RESTful JSON APIs. Operated by Monoova
  Global Payments Pty Ltd (AFSL 421414) and enrolled with AUSTRAC, it connects directly to the New Payments
  Platform (real-time account-to-account transfers via NPP/Osko, PayID addressing, and PayTo mandated
  debits) alongside BPAY, direct entry (credit/debit), card acquiring, and Apple Pay / Google Pay. Its
  Automatcher reconciliation engine, virtual mAccount/mWallet hierarchies, Confirmation of Payee, account
  verification, payment tokenisation, and webhook-driven reporting target fintechs, marketplaces, payroll,
  lending, remittance, and SaaS businesses (customers include Wise, Nium, Finder, and Sharesies). Monoova
  is genuinely API-first: it ships a public developer portal, a Redoc API reference, downloadable OpenAPI
  specifications, and a public Postman workspace, plus a free self-serve sandbox.'
