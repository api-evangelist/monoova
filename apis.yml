apis:
- aid: monoova:monoova-automatcher-bank-account-receivables-api
  name: Monoova Automatcher (Bank Account Receivables) API
  description: >-
    <h3>  Overview </h3> <p> Having customers paying you by bank transfer might be easy for your customers
    but contains a reconciliation risk for you. If your customer mistypes or forgets the reference to
    go with the payment, you might not know whom the payment is from. Orphaned transactions can be challenging
    and costly to handle. The solution is our receivables API. We allow you to assign a specific account
    number to each payer so you know for a fact where the received funds originated, regardless of whether
    they remembered to type the reference. </p> <p> Specifically, the bank-account receivables APIs allow
    the creation and maintenance of bank account numbers for the purpose of receiving and reconciling
    funds via direct credit. Once an account number is created, payments may be made via any banking institution
    in Australia to the BSB and account number provided by us to you. These account numbers can be toggled
    active/inactive and linked to a client provided unique ID. Once a transaction is received, Monoova
    provides reporting on the details of each item, and makes the funds available for disbursement in
    your Sign-in mAccount. Authentication is the same as for the rest of Monoova’s APIs. </p>
  humanURL: https://developer.monoova.com/overview
  baseURL: https://api.mpay.com.au
  tags:
  - Automatcher (Bank Account Receivables)
