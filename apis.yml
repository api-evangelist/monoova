- aid: monoova:monoova-verify-api
  name: Monoova Verify API
  description: >-
    <h3>Overview</h3> <h3>Bank Account Ownership Verification</h3> <p>The purpose of this API is to verify
    access to a bank account or PayID details, which has several compliance and risk-mitigation applications.</p>

    <p>If the NppCreditPayID method is used, the API response will include the PayID name. In scenarios
    where the PayID is either unidentified or not configured, you can verify if the payer/payee has access
    to the account using a secret code.</p>

    <p>By passing the BSB and account number, the account verification API will credit a target bank account
    with a secret code in the remitter name and lodgement reference. This code can only be viewed by someone
    who has access to the target bank account by accessing and viewing their bank statement. The code
    can then be submitted against our records, and if it matches, Monoova will persist a verification
    token against that specific account.</p>

    <h4>How it works</h4> <ol> <li>Initiate a verification transaction on the target bank account.</li>
    <li>Monoova will credit the target bank account with a 1c amount and a secret remitter code (may take
    up to 48 hours for the code to show on the target bank account).</li> </ol>

    <p>Below image is how a sample verification code appears on a bank statement. In YELLOW is the code
    your client will need to return, in BLUE is your remitter name. For NPP verification transactions,
    the secret code can also be found in the lodgement reference.</p> <img src="https://movdpwebsiteprodae.blob.core.windows.net/images/bank_ref.png"
    alt="bank-ref">

    <ol> <li>Owner of the target bank account views the statement to obtain the secret code.</li> <li>Submit
    the secret code to Monoova via POST <a href="/payments#operation/VerifyAccountValidate">verify/v1/aba/validate</a>.
    In the sandbox, use code "555555" to test successful validation of an account verification.</li> <li>If
    the submitted code and amount are correct, the target bank account is designated as verified.</li>
    </ol>
  humanURL: https://developer.monoova.com/overview
  baseURL: https://api.mpay.com.au
  tags:
  - Verify
  properties:
  - type: OpenAPI
    url: openapi/monoova-verify-api-openapi.yml
