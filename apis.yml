- aid: monoova:monoova-maccount-api
  name: Monoova M Account API
  description: >-
    <h3>  Overview </h3> The mAccount is the name we have given our virtual account. It is at the centre
    of anything you do with our Payments Engine. In many ways, your mAccount(s) is you in the Engine,
    this is where you get authenticated, where your funds flow in and out, and where you get your reports.
    It is also the building block for a bespoke ecosystem of virtual accounts which you can build in the
    Engine. And though we call it an account, it can just as easily be used as a wallet. The APIs in this
    section do not perform financial transactions. Instead, they are used to manage mAccount information
    in the Engine. The /financial/v2/transaction API verifies mAccount information using this subsystem
    before performing a transaction.
  humanURL: https://developer.monoova.com/overview
