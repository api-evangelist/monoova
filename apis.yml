- aid: monoova:monoova-bpay-api
  name: Monoova BPAY API
  description: >-
    <h3>  Overview </h3> The BPAY APIs do not perform any financial transactions and are used to validate
    BPAY information that is used in the <a href="/payments#operation/TransactionExecute"> /financial/v2/transaction/execute
    </a>  API. The <a href="/payments#operation/TransactionValidate"> /financial/v2/transaction/validate
    </a> APIs also validates BPAY information using the same sub-system as documented in this section
    before performing any financial transactions.<br> <p> <strong>  Important Notes </strong> </p> <li>
    By design, BPAY validation can be time sensitive. If you cache valid BPAY information for later use,
    it may become invalid due to time expiry.</li> <li> By design, BPAY validation can be amount sensitive.
    If you cache valid BPAY information for later use and change the amount to pay then this could be
    invalid.</li> <li> BPAY validation should be performed immediately before calling the <a href="/payments#operation/TransactionExecute">
    /financial/v2/transaction/execute </a> API to perform the bill payment. You have the option of calling
    <a href="/payments#operation/TransactionValidate"> /financial/v2/transaction/validate </a> (The first
    validation error will be returned which may not be a BPAY error) </li>
  humanURL: https://developer.monoova.com/overview
  baseURL: https://api.mpay.com.au
