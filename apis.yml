- aid: monoova:monoova-whitelisting-for-automatcher-bank-account-receivables-api
  name: Monoova Whitelisting for Automatcher (Bank Account Receivables) API
  description: >-
    <h3>  Overview </h3> <p> This feature enables whitelisting of bank accounts when receiving funds in
    automatcher accounts. Funds received from a non-whitelisted account will be automatically returned.
    Using this feature, funds received can be limited to pre-approved bank accounts only. </p> <p> There
    are 2 criteria that can be set when whitelisting bank account numbers. </p> <p> Inbound transaction
    will only be accepted from:&nbsp; </p> <p> 1. An account that matches a whitelisted account name;
    AND/OR <br/> 2. An account that matches a whitelisted BSB and account number </p> <p> If pre-defined
    criteria are not met, the transaction will be returned to the sender automatically. If enabled, each
    automatcher account has its own separate whitelist. </p> <p> You have the option to establish a webhook
    subscription to receive a notification when a payment is declined as a result of whitelist restrictions.
    </p> <p> To subscribe to a webhook use the <a href="/payments#tag/Subscriptions"> Subscriptions </a>
    APIs. Event name:&nbsp; <strong>InboundDirectCreditRejections</strong></p>
  humanURL: https://developer.monoova.com/overview
  baseURL: https://api.mpay.com.au
  tags:
  - Whitelisting for Automatcher (Bank Account Receivables)
  properties:
  - type: OpenAPI
    url: openapi/monoova-whitelisting-for-automatcher-bank-account-receivables-api-openapi.yml
