- aid: monoova:monoova-token-api
  name: Monoova Token API
  description: >-
    <h3> Overview </h3> <p> Using tokens is a way of increasing the security around sensitive information.
    A token can be used to obfuscate debit and credit details. The details of a token (its payload) are
    stored encrypted on the Engine servers. The tokening system has been designed such the generated token
    has no mathematical or algorithmic connection to the secret data held as the payload. The token is
    a random number that is manifested as a GUID. Currently two types of payloads can be held within the
    tokening system </p> <ul> <li> Australian Bank Account </li> <li> BPAY details </li> </ul> <p> Other
    payload types can be added if required. For example, if you have asked the user to enter their bank-account
    details on your website you can use the security/v1/createOneShotSecurityToken API to embed an OneShotSecurityToken
    in your page. Using this OneShotSecurityToken you can call the appropriate token/v1/create API passing
    the details. This way, the customer’s payload details are never passed through your server. </p>
  humanURL: https://developer.monoova.com/overview
  baseURL: https://api.mpay.com.au
  tags:
  - Token
