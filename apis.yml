- aid: monoova:monoova-financial-api
  name: Monoova Financial API
  description: >-
    <h3> Overview </h3>

    <p> The Financial APIs enable you to process credits and debits, including transferring funds within
    Monoova to a Ledger Account, an mWallet (for BPAY transactions), or an mAccount (our virtual account).
    You can send payments to external Australian bank accounts using a BSB and account number, token,
    or PayID, and make BPAY payments using a biller code and CRN. </p>

    <p> The APIs also allow you to debit Australian bank accounts using Direct Debit, and retrieve the
    status of transactions. </p>
