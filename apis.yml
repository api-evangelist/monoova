- aid: monoova:monoova-reconciliation-rules-api
  name: Monoova Reconciliation Rules API
  description: >-
    <h3>  Overview </h3> <p> This feature enables customers to specify the criteria for accepting incoming
    NPP and DE payments in real time. The customer will be able to advise Monoova about the exact amount
    they expect to receive in their ABA/PayId in an agreed timeframe. This information would be used to
    determine whether to accept or reject a payment.<br/><br/> There are 2 criteria that can be set when
    specifying the reconciliation rules. Inbound transactions will only be accepted if <ul> <li>Bsb -
    Account Number and amount matches an active reconciliation rule. OR</li> <li>PayId and amount match
    an active reconciliation rule</li> </ul> If pre-defined criteria are not met, the transaction will
    automatically be returned to the sender. <br/><br/> These rules will not be applied to NPP PayTo Receivables.<br/>
    </p>
  humanURL: https://developer.monoova.com/overview
  baseURL: https://api.mpay.com.au
  tags:
  - Reconciliation Rules
