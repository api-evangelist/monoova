- aid: monoova:monoova-payto-async-api-api
  name: Monoova PayTo Async API
  description: >-
    The `AsyncResponse` is used in operations where the request is accepted, but the processing is not
    immediate. This response format provides information for tracking and checking the request status.


    This API adheres to the Microsoft [async-request-reply pattern](https://learn.microsoft.com/en-us/azure/architecture/patterns/async-request-reply),
    ensuring efficient handling of non-immediate requests.


    Featuring high throughput and generous rate limits, this API is optimal for bulk operations, allowing
    for the efficient processing of larger datasets.


    </br>


    ### HTTP Status Code


    - **202 Accepted**:
      - *Description*: Indicates that the request has been accepted for processing but has not been completed.

    ### HTTP Headers


    - **Location**:
      - *Description*: Provides the URL where the client can check the status of the asynchronous operation.
    Clients should periodically poll this URL to retrieve the final result of the request.
      - *Example*: `https://sand-api.monoova.com/...`

    - **Retry-After**:
      - *Description*: Suggests the number of seconds the client should wait before polling the Location
    URL again. This helps manage server load by preventing requests that are too frequent.
      - *Example*: `10`
  humanURL: https://developer.monoova.com/overview
  baseURL: https://api.mpay.com.au
