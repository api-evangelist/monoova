apis:
- aid: monoova:monoova-payments-api
  name: Monoova Payments API
  description: >-
    Monoova's core Payments API (v5.29) to receive, manage, and pay AUD across
    all Australian payment rails - real-time transfers via NPP/Osko, direct
    credit and direct debit, BPAY, card payments, and PayID. Includes the
    Automatcher bank-account receivables engine, virtual mAccount and mWallet
    hierarchies, ledger accounts, financial and reconciliation reporting,
    account verification, payment tokenisation, and webhooks. Authenticated with
    HTTP Basic auth (API key as the username).
  humanURL: https://developer.monoova.com/overview
  baseURL: https://api.mpay.com.au
  tags:
  - Payments
  - NPP
  - PayID
  - BPAY
  - Automatcher
  properties:
  - type: OpenAPI
    url: openapi/monoova-payments.yml
  - type: Documentation
    url: https://developer.monoova.com/overview
  - type: APIReference
    url: https://api-docs.monoova.com/
- aid: monoova:monoova-payto-api
  name: Monoova PayTo API
  description: >-
    Monoova's PayTo API (v1) for the New Payments Platform's mandated
    account-to-account debit service - create and manage payment agreements
    (mandates), initiate payments against them, handle mandate and payment
    status lifecycles, and receive notifications and webhooks. Authenticated
    with short-lived (24h) Bearer tokens obtained via HTTP Basic auth.
  humanURL: https://developer.monoova.com/payto
  baseURL: https://api.monoova.com
  tags:
  - PayTo
  - Real-Time Payments
  - Mandates
  properties:
  - type: OpenAPI
    url: openapi/monoova-payto.yml
  - type: Documentation
    url: https://developer.monoova.com/payto
  - type: APIReference
    url: https://api-docs.monoova.com/
- aid: monoova:monoova-card-payments-api
  name: Monoova Card Payments API
  description: >-
    Monoova's Card Payments API (v1) for accepting card payments, including
    tokenised card flows and webhook notifications for payment events.
    Authenticated with short-lived (24h) Bearer tokens obtained via HTTP Basic
    auth.
  humanURL: https://developer.monoova.com/card-payments
  baseURL: https://api.monoova.com
  tags:
  - Card Payments
  - Acquiring
  properties:
  - type: OpenAPI
    url: openapi/monoova-cc.yml
  - type: Documentation
    url: https://developer.monoova.com/card-payments
  - type: APIReference
    url: https://api-docs.monoova.com/
