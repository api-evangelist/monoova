notes: >-
  Monoova ships no first-party npm, PyPI, Maven, RubyGems, Packagist, or
  crates.io client library. The primary integration surface is the RESTful JSON
  API directly; the C# Merchant SDK and WooCommerce plugin above are the only
  org-published code artifacts. A browser-side hosted Card SDK (JS) is
  documented separately and captured in components/monoova-components.yml.
