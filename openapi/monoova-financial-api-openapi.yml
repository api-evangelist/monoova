          description: "This is a unique reference generated by the calling service. \nThis is a nonce. Its use is to determine if a request has already been received by the Engine.\nWe strongly recommend sending a uniqueReference in your execution call to avoid duplicate transactions.\n"
          example: f484ec18-6e1f-481b-a4bf-bea515d8lk34
          maxLength: 200
        printUniqueReferenceOnStatement:
          type: boolean
          default: false
          description: If true, the uniqueReference will be printed on the statement. Default is false.
        totalAmount:
          type: number
          format: double
          example: 10.0
          minimum: 0.01
          description: This is the total amount of the transaction. It must match the sum of all disbursement amounts specified in the disbursements array if both are present.
        paymentSource:
          type: string
          description: "This is the type of transaction. \nThe correct type MUST be used as it instructs the Engine to move funds according to established rules. \nValid values are <strong> mAccount, mWallet, directDebit, token </strong>\n"
          enum:
          - mAccount
          - mWallet
          - directDebit
          - bulkDirectDebit
          - token
      discriminator:
        propertyName: paymentSource
        mapping:
          mAccount: '#/components/schemas/paymentSource.mAccount'
          mWallet: '#/components/schemas/paymentSource.mWallet'
          directDebit: '#/components/schemas/paymentSource.directDebit'
          bulkDirectDebit: '#/components/schemas/paymentSource.bulkDirectDebit'
          token: '#/components/schemas/paymentSource.token'
