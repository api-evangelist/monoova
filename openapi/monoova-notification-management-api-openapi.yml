components:
  schemas:
    WebHookResponse:
      type: object
      properties:
        eventId:
          type:
          - string
          - 'null'
        sourceEventName:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
        eventTimestamp:
          type:
          - string
          - 'null'
          format: date-time
        executionCompleteDateTimeUtc:
          type:
          - string
          - 'null'
          format: date-time
        payload:
          type:
          - string
          - 'null'
        method:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
        statusDescription:
          type:
          - string
          - 'null'
        lastResponseCode:
          type:
          - integer
          - 'null'
          format: int32
        retryCount:
          type:
          - integer
          - 'null'
          format: int32
        clientRequestedResend:
          type: boolean
      additionalProperties: false
    SubscriptionUpdateResponse:
      type: object
      properties:
        traceId:
          type:
          - string
          - 'null'
        subscriptionId:
          type:
          - string
          - 'null'
      additionalProperties: false
    WebHookDetail:
      type: object
      properties:
        callBackUrl:
          type:
          - string
          - 'null'
          example: http://demo7446995.mockable.io/pagnotification
          description: URL of your server.
        securityToken:
          type: string
          example: Basic 13222276767676
          description: This token will be sent back with the callback in Authorization header. (Authorization &#58;  [type] [credentials]  (e.x Basic Rjc1234567890jdGMS67890U78...)) When creating the token, both 'type' and 'credentials' are required.
      required:
      - callBackUrl
      additionalProperties: false
    SubscriptionListResponse:
      type: object
      properties:
        status:
          type:
          - string
          - 'null'
        statusDescription:
          type:
          - string
          - 'null'
        subscriptionDetails:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SubscriptionDetailResponse'
      additionalProperties: false
    SubscriptionDetailResponse:
      type: object
      properties:
        subscriptionName:
          type:
          - string
          - 'null'
          maxLength: 36
          description: User-Defined name, to make the purpose or owner clear. </br> Name provided by customers only.
          pattern: ^[A-Za-z0-9_-]
        eventName:
          type:
          - string
          - 'null'
          description: The event we are subscribing to.</br> Must be “PaymentAgreementNotification” - the forwards all payment agreement events to the Webhook URL.
        notificationType:
          type:
          - string
          - 'null'
        webHookDetail:
          $ref: '#/components/schemas/WebHookDetailGet'
        isActive:
          type: boolean
      required:
      - subscriptionName
      - eventName
      - isActive
      additionalProperties: false
    WebHookResendResponse:
      type: object
      required:
      - status
      - statusDescription
      properties:
        status:
          type:
          - string
          - 'null'
        statusDescription:
          type:
          - string
          - 'null'
      additionalProperties: false
    WebHookListResponse:
      type: object
      properties:
        status:
          type:
          - string
          - 'null'
        statusDescription:
          type:
          - string
          - 'null'
        notifications:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/WebHookResponse'
      additionalProperties: false
    SubscriptionDetailUpdateRequest:
      type: object
      properties:
        subscriptionName:
          maxLength: 36
          example: PayToTest
          description: User-Defined name, to make the purpose or owner clear. </br> Name provided by customers only.
          pattern: ^[A-Za-z0-9_-]
        eventName:
          type:
          - string
          - 'null'
          description: The event we are subscribing to.</br> Must be “PaymentAgreementNotification” - the forwards all payment agreement events to the Webhook URL.
          example: PaymentAgreementNotification
        webHookDetail:
          $ref: '#/components/schemas/WebHookDetail'
        isActive:
          type: boolean
          example: true
      required:
      - subscriptionName
      - eventName
      - isActive
      additionalProperties: false
    SubscriptionDeleteResponse:
      type: object
      properties:
        traceId:
          type:
          - string
          - 'null'
        errors:
          type:
          - string
          - 'null'
      additionalProperties: false
    WebHookDetailGet:
      type: object
      properties:
        callBackUrl:
          type:
          - string
          - 'null'
          example: http://demo7446995.mockable.io/pagnotification
          description: URL of your server.
      required:
      - callBackUrl
      additionalProperties: false
    WebHookResponse_2:
      type: object
      properties:
        eventId:
          type: string
        sourceEventName:
          type: string
        url:
          type: string
        eventTimestamp:
          type: string
          format: date-time
        executionCompleteDateTimeUtc:
          type: string
          format: date-time
        payload:
          type: string
        method:
          type: string
        status:
          type: string
        statusDescription:
          type: string
        lastResponseCode:
          type: integer
          format: int32
        retryCount:
          type: integer
          format: int32
        clientRequestedResend:
          type: boolean
      additionalProperties: false
    SubscriptionUpdateResponse_2:
      type: object
      properties:
        traceId:
          type: string
          example: 5b5d2d6e-1972-4be4-ac95-8a373b9d90c5
        subscriptionId:
          type: string
          example: 5d930864-76e9-4945-bc7c-7645e38d860b
      additionalProperties: false
    WebHookDetail_2:
      type: object
      required:
      - callBackUrl
      properties:
        callBackUrl:
          type: string
          example: http://demo62eacbbe3c14.mockable.io/pagnotification
          description: URL of your server.
        securityToken:
          type: string
          example: Basic 13222276767676
          description: This token will be sent back with the callback in Authorization header. (Authorization &#58;  [type] [credentials]  (e.x Basic Rjc1234567890jdGMS67890U78...)) When creating the token, both 'type' and 'credentials' are required.
      additionalProperties: false
    SubscriptionListResponse_2:
      type: object
      properties:
        traceId:
          type: string
          example: 5b5d2d6e-4972-4be4-ab95-8a373b9d90c5
        subscriptionDetails:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SubscriptionDetailResponse_2'
      additionalProperties: false
    SubscriptionDetailResponse_2:
      type: object
      required:
      - subscriptionName
      - eventName
      - isActive
      properties:
        subscriptionName:
          type: string
          maxLength: 36
          description: User-Defined name, to make the purpose or owner clear. Name provided by customers only.
          pattern: ^[A-Za-z0-9_-]+
          example: PaytoTest
        eventName:
          type: string
          description: The event we are subscribing to. Must be ‘PaymentAgreementNotification’ - forwards all payment agreement events to the Webhook URL.
          example: PaymentAgreementNotification
        subscriptionId:
          type: string
          example: 734d8a9d-7ac6-44a7-9e88-867fb59f54e9
        notificationType:
          type: string
        webHookDetail:
          $ref: '#/components/schemas/WebHookDetailGet_2'
        isActive:
          type: boolean
          example: true
      additionalProperties: false
    WebHookResendResponse_2:
      type: object
      properties:
        traceId:
          type: string
          example: f1a7fbd7-cb39-4b98-b2a7-f4e0e004f152
      additionalProperties: false
    WebHookListResponse_2:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/WebHookResponse_2'
      additionalProperties: false
