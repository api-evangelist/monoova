  /au/core/notification-v1/Notification:
    get:
      tags:
      - Notification Management
      summary: GET Webhooks
      operationId: get-webhookschedule
      parameters:
      - name: start
        in: query
        description: Format - date-time (as date-time in RFC3339).
        schema:
          type: string
          format: date-time
      - name: pageSize
        in: query
        description: Format - int32.
        schema:
          type: integer
          format: int32
      - name: pageNumber
        in: query
        description: Format - int32.
        schema:
          type: integer
          format: int32
      - name: end
        in: query
        description: Format - date-time (as date-time in RFC3339).
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebHookListResponse'
              example:
                traceId: d5e0b5ee-2aff-4ac7-a638-893b664183a3
                notifications:
                - eventId: 2a37987a-0486-4c6f-9267-9ff44eb168c6
                  sourceEventName: PaymentAgreement_Updated
                  url: https://f89be4be-781a-47cd-8048-8ba3f5438d56.mock.pstmn.io/PaymentAgreementNotificaion
                  eventTimestamp: 2022-08-29 03:11:01.471000+00:00
                  executionCompleteDateTimeUtc: 2022-08-29 03:11:03.365000+00:00
                  status: Success
                  statusDescription: Hello
                  lastResponseCode: 200
                  retryCount: 0
        '400':
          description: Error
          content:
            application/json:
              example:
                traceId: f1a7fbd7-ca39-4b98-b247-f4e0e004f152
                errors:
                - errorCode: string
                  errorMessage: string
        '403':
          description: Error
          content:
            application/json:
              example:
                traceId: f1a7fbd7-ca39-4b98-b247-f4e0e004f152
                errors:
