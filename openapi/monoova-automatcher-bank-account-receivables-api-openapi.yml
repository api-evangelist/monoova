  /receivables/v1/batchCreate:
    post:
      tags:
      - Automatcher (Bank Account Receivables)
      summary: Batch Create
      description: 'The batch create API has the same functionality as the <a href="/payments#operation/ReceivablesCreate"> /receivables/v1/create  </a> endpoint however it allows you to create up to 50,000 accounts in a single call by submitting a file. We recommend this for circumstances where > 100 accounts need to be created within a short time period.

        Creation of accounts with isActive=true is restricted to 1000. Multiple batches cannot be requested at the same time, you have to wait for the completion of a batch before requesting a new one.

        The Batch Create API also supports a lightweight option whereby many accounts can be created by submitting a single line. This option automatically sets isActive = true, hence you can only request the creation of 1000 accounts in one request. For this method, all accounts will be created with the same specified name, and clientuniqueid’s cannot be specified will be automatically generated. <br/> <br/>'
      operationId: ReceivablesBatchCreate
      x-codeSamples:
      - lang: Detail example
        source: '[bankAccountName,clientUniqueId,isActive,bsb]

          [Bank14399997,S45D927DA07094859A5E5B1E532A12CA,true,802-985]

          [Bank14399997,K275D304BE0B947829224BE7BC8A6AEF,true,802-985]

          [Bank14399997,T13686BC4B7364A13AE092A2CA1DFCF6,true,802-985]

          [Bank12399997,SHU13LJ6Z0356ZWAZPTFTQ0K6VZQG2NO,false,802-985]

          '
      - lang: Lightweight example
        source: '[bankAccountName,count,bsb]

          [My company pty ltd,4,802-985]

          '
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              description: "Batch create requires parameters to be submitted as a file, with headers. The header and each new record are enclosed in square brackets.\nThe columns are comma separated with the following format:\n<br/>\n<br/>\n<br/>\nDetail example\n<table class=\"tb\">\n<tr>\n<td class=\"td\"> bankAccountName </td>\n<td class=\"td\"> clientUniqueId </td>\n<td class=\"td\"> isActive </td>\n<td class=\"td\"> bsb </td>\n</tr>\n<tr>\n<td class=\"td\">\n<br/> <br/>\nThe name of the account to be paid into. <br/>\nThis will be defaulted to your registered Trading Name. <br/>\n<br/> <br/>\n</td>\n<td class=\"td\">\nAn identifier assigned to the account. <br/>\nMust be unique. <br/>\nIf not provided Monoova will generate and <br/>\nreturn a value automatically. <br/>\n</td>\n<td class=\"td\">\nUsed to open and close account numbers. <br/>\nClosed account numbers will return all payments <br/>\nmade to that account number. <br/>\nIf not provided this value defaults to false. <br/>\n</td>\n<td class=\"td\">\nOptional. If this column is added, please provide a valid value.\n</td>\n</tr>\n</table> <br/>\n\nLightweight example\n<table class=\"tb\">\n<tr>\n<td class=\"td\"> bankAccountName </td>\n<td class=\"td\"> count </td>\n<td class=\"td\"> bsb </td>\n</tr>\n<tr>\n<td class=\"td\">\n<br/> <br/>\nThe name of the account to be paid into. <br/>\nThis will be defaulted to your registered Trading Name. <br/>\n<br/> <br/>\n</td>\n<td class=\"td\">\nNumeric, number of accounts you wish to create with this name. <br/>\n</td>\n<td class=\"td\">\nOptional. If this column is added, please provide a valid value.\n</td>\n</tr>\n</table> <br/>\n<td class=\"td\">\n  Optional BSB parameter. If not specified, default BSB logic applies.\n</td>\n</tr>\n</table>\n"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/receivablesBatchCreate_V1'
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
  /receivables/v1/batchStatus:
    post:
      tags:
      - Automatcher (Bank Account Receivables)
      summary: Batch Status
      description: 'The batch Status API functions similarly to the <a href="/payments#operation/ReceivablesStatus"> /receivables/v1/Status </a> API,

        however it allows you to update accounts in batch.

        You can only update 1000 records per request. Multiple batches cannot be requested at the same time,

        you have to wait for the completion of a batch before requesting a new one.

        <br/>

        <br/>

        '
      operationId: ReceivablesbatchStatus
      x-codeSamples:
