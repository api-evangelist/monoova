          [TR1268FA85FCED4E9793B57E71F985AD2,81225401,true,]

          [D308A7F0B8CD4C909CCEAC2CEDD624917,41900918,true,]

          [KO22043D20EEF847209A9E50D86F915E0,67953481,true,]

          [MP578B76FC71574A4BAF848D94268970F,71828803,true,]

          '
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              description: 'Batch status requires parameters to be submitted as a file, the header and each new record are enclosed in square brackets.

                The columns are comma separated with the following format:

                <table class="tb">

                <tr>

                <td class="td"> clientUniqueId </td>

                <td class="td"> bankAccountNumber </td>

                <td class="td"> isActive </td>

                <td class="td"> bsb </td>

                </tr>

                <tr>

                <td class="td">

                The unique identifier for the account to open or close. <br/>

                `at least one of clientUniqueId or bankAccountNumber`<br/>

                `required` <br/>

                </td>

                <td class="td">

                <br/> <br/>

                The bank account number for the account to open or close. <br/>

                `at least one of clientUniqueId or bankAccountNumber`<br/>

                `required` <br/>

                <br/> <br/>

                </td>

                <td class="td">

                Used to open and close account numbers. <br/>

                Closed account numbers will return all payments <br/>

                made to that account number. <br/>

                </td>

                <td class="td">

                Optional BSB parameter. If not specified, default BSB logic applies.

                </td>

                </tr>

                </table>

                '
      responses:
