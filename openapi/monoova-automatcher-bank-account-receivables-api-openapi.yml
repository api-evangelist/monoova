  /receivables/v1/processdirectdebit:
    post:
      tags:
      - Automatcher (Bank Account Receivables)
      summary: Process Direct Debit
      description: Automatcher accounts can also process direct debits from external organisations against them. By default this behaviour is disabled. If configured to allow direct debits, a notification will be sent when an external party attempts to debit one of your accounts, and if accepted, the funds will be deducted from your sign in mAccount. <br><br> Notification of a pending direct debit are sent via a <a href="/payments#operation/InboundDirectDebitWebhook"> callback </a> or a <a href="/payments#operation/ReceivablesInboundDirectDebitReportDate"> report </a> API can be called to list all pending debits. <br><br> After receiving a notification, you have until 4:00pm next business day (from the time the initial debit is received) to instruct us on what action to take; either approve or reject. If no action is taken the transaction will be placed into a pending status until expiry next business day at 4pm. <br><br> For expiring transactions, the direct debit request will automatically be actioned based on your account default configuration. <br><br> Configuration options are:<br><br> a)  Accept direct debit request for all requests<br> b)  Reject direct debit for all requests <br><br> Note if you do not have sufficient balance in your sign in mAccount you cannot accept direct debits and expiring direct debits will be automatically returned regardless of configuration.
      operationId: ReceivablesProcessDirectDebit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/receivables.processdirectdebit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/receivablesProcessDirectDebitResponse_V1'
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
