        schema:
          type: integer
          example: 13
          enum:
          - 13
          - 50
      - name: payId
        in: query
        required: false
        description: Email address for the PayID.
        schema:
          type: string
          example: xxx@xxx.xx
      - name: payIdName
        in: query
        required: false
        description: Name displayed to the payers.
        schema:
          type: string
          example: abcdefgh
