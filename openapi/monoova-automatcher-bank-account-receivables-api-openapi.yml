  /receivables/v1/processRtgsImt:
    post:
      tags:
      - Automatcher (Bank Account Receivables)
      summary: Receive Swift Transfers (RTGS/IMT transactions)
      description: 'Automatcher accounts can be configurated to receive Swift Transfers. This includes both RTGS (Real Time Gross Settlement) and IMT (International Money Transfers).


        If the account is not configured to receive Swift Transfers, the transaction will be automatically rejected on our end. If configured to allow RTGS/IMT transactions, a notification will be sent when an external party attempts to credit to one of your accounts, and if accepted, the funds will be credited to your sign in mAccount or nominated mAccount. Please contact Monoova for configuration of account.


        Notification of a RTGS/IMT are sent via a callback or a report API can be called to list all pending transactions.


        After receiving a notification, you have 2 business days to either confirm or reject. If no action is taken the transaction will be placed into a pending status until expiry.


        For expiring transactions, the RTGS/IMT transactions will automatically be actioned based on your account default configuration.


        Configuration options are:


        a) Confirm - Accept all incoming RTGS/IMT Transactions

        b) Reject - Reject all incoming RTGS/IMT Transactions'
      operationId: ReceivablesProcessRtgsImt
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/receivables.processrtgsimt'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/receivablesProcessDirectDebitResponse_V1'
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
  /receivables/v2/rtgsimtReport/{date}:
    get:
      tags:
      - Automatcher (Bank Account Receivables)
      summary: RTGS/IMT Report
      description: 'Returns a report of all received transactions for the day with associated details, this includes RTGS (real-time gross settlement) and International Money Transfer. If requested multiple times on the current date (calendar day, AEDT), the report is cumulative. E.g. if, on the same day, a report is requested at 10am and another one at 1pm, the report at 1pm will contain all the transactions already contained in the 10am report, in addition to any new transactions.


        The report is an application/octet-stream, columns are comma separated. Where a comma(,) or double quote(") is present in any of the below fields, the field will be encased in double quotes and/or escaped as per RFC4180

        Columns are as follows:


        Transaction ID AccountNumber BSB AccountName TransactionReferenceNumber Amount Status LodgementRef Date SourceAccountDetails RespondBeforeDateTime RejectReasonDescription ProcessedDate SendingOrganisation ReceivingOrganisation OrderingInstitution OriginatingAddress


        Monoova generated

        Unique ID.

        Max 12 chars.


        Payee Bank Account

        Number. Max 34 chars. Payee BSB.

        Max 7 Chars. Payer submitted Account

        Name. Max 32 chars. TransactionReferenceNumber.

        Max 21 chars. Payment amount,

        2 decimal places

        for cents. Max 11 chars. Transaction status,

        possible values:

        Pending, Confirmed and Rejected. Payer submitted reference.

        Max 280 chars. AEDT, Sydney.

        Max 27 chars. Source Account Name address and account number The time user has to Confirm/Reject a transaction. AEDT, Sydney.

        Max 27 chars. Reason why transaction was rejected.

        Max 500 chars. The time when transaction was Confirmed/Rejected. AEDT, Sydney.

        Max 27 chars. Sending Organisation.

        Max 100 chars. Receiving Organisation.

        Max 100 chars. Ordering Institution.

        Max 100 chars. Originating Address.

        Max 100 chars.'
      operationId: ReceivablesRTGSIMTReportDate
      parameters:
      - name: date
        in: path
        required: true
        description: This becomes the start date of the report if report is being fetched for a date range. Date format should be 'yyyy-MM-dd' format.
        schema:
          type: string
          example: '2020-03-15'
      - name: endDate
        in: query
        required: false
        description: Use this to fetch the report for a date range. Date format should be 'yyyy-MM-dd' format
        schema:
          type: string
          example: '2020-04-08'
      - name: skip
        in: query
        required: false
        description: Number of records to skip. 1 is the first record.Value should be greater than 0
        schema:
          type: integer
          example: 1
      - name: take
        in: query
        required: false
        description: Number of records to take. If endDate is provided maximum take is 10000.
        schema:
          type: integer
          example: 1000
      responses:
        '200':
          description: OK
          content:
            text/plain:
              examples:
                response:
                  value: 'Transaction Id,Account Number,BSB,AccountName,Transaction Reference Number,Amount,Status,Lodgement Reference,Date,Source Account Details,Respond Before Date Time,Reject Reason Description,Processed Date,Sending Organisation,Receiving Organisation,Ordering Institution,Originating Address,ledgerAccountNumber,ledgerUniqueReference

