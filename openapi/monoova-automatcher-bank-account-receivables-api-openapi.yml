components:
  schemas:
    receivablesStatusSetResponse_V1:
      properties:
        durationMs:
          description: 'This value represents the total time in milliseconds that the Platform took to process the request. '
          type: integer
          format: int64
          example: 20
        status:
          description: This is the status of executing the request.&nbsp;A code of ‘Ok’ indicates no errors
          type: string
          example: Ok
        statusDescription:
          description: This is a plain English description of the status.
          type: string
          example: Operation completed successfully
        bsb:
          description: The BSB number corresponding to the bank account number.
          type: string
          example: 123-123
        bankAccountNumber:
          description: The bank account number for which isActive has been updated.
          type: string
          example: '153884104'
        bankAccountName:
          description: The name of the account to be paid into. This will be defaulted to your registered Trading Name.
          type: string
          example: Bank1234444
        clientUniqueId:
          description: The unique identifier for which isActive has been updated.
          type: string
          example: 862944D057FC408B9B04541C2BA12
        isActive:
          description: The value for isActive after update. true or false.
          type: boolean
          example: false
      type: object
    receivables.processrtgsimt:
      type: object
      required:
      - transactionId
      - response
      - returnCode
      properties:
        transactionId:
          type: string
          minLength: 12
          maxLength: 12
          example: D00100539578
          description: This is the transactionId that appears in call back and report.
        response:
          type: string
          example: Reject
          enum:
          - Confirm
          - Reject
          description: Confirm to accept RTGS/IMT transaction. Reject to reject RTGS/IMT transaction.
        rejectionReasonCode:
          type: string
          enum:
          - AM02
          - AM06
          - AM07
          - BE05
          - AG01
          - MS01
          - RR02
          - RR03
          - BE04
          example: AM06
          description: AM02    (Transaction amount is greater than allowed maximum) <br> AM06    (Transaction amount is less than agreed minimum) <br> AM07    (Amount has been  blocked by regulatory authorities.) <br> BE05      (Sender is not recognised by beneficiary) <br> AG01     (No agreement is on file at the receiver for affecting associated transaction) <br> MS01    (Reason has not been specified due to sensitivities.) <br> RR02  (Senders name and/or address needed for regulatory requirements is insufficient or missing.) <br> RR03  (Recipients name and/or address needed for regulatory requirements is insufficient or missing.) <br> BE04    (Specification of beneficiary address, which is required for payment, is missing/not correct.). <br> <strong> Note&#58; </strong> RejectionReasonCode is only required if response is "Reject". RejectionReasonCode can be omitted if response is "confirm".
    receivables.status:
      type: object
      properties:
        bankAccountNumber:
          type: string
          example: '153884104'
          description: The bank account number for the account to open or close. <br/> `at least one of clientUniqueId or bankAccountNumber required`
          maxLength: 9
        bsb:
          type:
          - string
          - 'null'
          description: Optional BSB parameter. If not specified, default BSB logic applies.
          example: 802-985
        clientUniqueId:
          type: string
          uniqueItems: false
          example: 862944D057FC408B9B04541C2BA12
          description: The unique identifier for the account to open or close. <br/> `at least one of clientUniqueId or bankAccountNumber required`
          minLength: 10
          maxLength: 35
        isActive:
          type: boolean
          example: false
          description: Used to open and close account numbers. Closed account numbers will return all payments made to that account number.
    receivablesProcessDirectDebitResponse_V1:
      properties:
        durationMs:
          description: 'This value represents the total time in milliseconds that the Platform took to process the request. '
          type: integer
          format: int64
          example: 20
        status:
          description: This is the status of executing the request.&nbsp;A code of ‘Ok’ indicates no errors
          type: string
          example: Ok
        statusDescription:
          description: This is a plain English description of the status.
          type: string
          example: Operation completed successfully
        uniqueReferenced:
          description: This is your uniqueReference that was passed in when the transaction was executed
          type: string
          example: 7cac95f8-6c9f-40e7-aa44-d058f601ee71
        transactionId:
          description: This is the transactionId that was returned when the transaction was executed
          type: integer
          format: int32
          example: 16875766
        feeAmountExcludingGst:
          description: This is the fee amount Excluding GST that has been debited from your mAccount
          type: number
          format: decimal
          example: 0.1
        feeAmountGstComponent:
          description: This is the GST Component of the fee amount that has been debited from your mAccount
          type: number
          format: decimal
          example: 0.01
        feeAmountIncludingGst:
          description: This is the total fee amount Including GST that has been debited from your mAccount
          type: number
          format: decimal
          example: 0.11
      type: object
    receivables.create:
      type: object
      properties:
        akaNames:
          type: array
          maxItems: 3
          items:
            type: string
            pattern: ^[ -~]{1,140}$
          description: Up to three optional AKA names can be supplied per account.
          example:
          - Jones Island Dairy
          - Jones Island Dairy1
          - Jones Island Dairy2
        submerchantId:
          type: string
          pattern: ^[ -~]{1,35}$
          example: 93bf57eb1e2c42cf8101509b4356741e
          description: The submerchant ID provided by Monoova.<br/> The following submerchant IDs can be used in sandbox for testing purposes.<br/> 93bf57eb1e2c42cf8101509b4356741e<br/> 78f225280b154fa8982d96e61cc9159d<br/> 49da5e40420849ee97a74e7450b1b04b<br/> 13c96168aed440efa2ceb8241452a3a2<br/>
        bankAccountName:
          type: string
          uniqueItems: false
          example: Bank1234444
          pattern: '“ !\"#$%&''()*,-./:;=?@[a-zA-B0-9]{|}”

            '
          description: The name of the account to be paid into. This will be defaulted to your registered Trading Name.
          minLength: 2
          maxLength: 32
        bsb:
          type:
          - string
          - 'null'
          description: Optional BSB parameter. If not specified, default BSB logic applies.
          example: 802-985
        clientUniqueId:
          type: string
          uniqueItems: false
          example: 862944D057FC408B9B04541C2BA12
          pattern: '[a-zA-Z0-9]'
          description: An identifier assigned to the account. Must be unique. If not provided Monoova will generate and return a value automatically.
          minLength: 10
          maxLength: 35
        isActive:
          type: boolean
          default: false
          example: true
          description: Used to open and close account numbers. Closed account numbers will return all payments made to that account number. If not provided this value defaults to false. The Automatcher account can take up to 5 mins to be registered and become active before a PayID can be assigned or deposits can be made to the account. The status will automatically changes from false to true.
