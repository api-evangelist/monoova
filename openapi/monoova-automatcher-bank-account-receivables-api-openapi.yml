  /receivables/v1/processRtgsImt:
    post:
      tags:
      - Automatcher (Bank Account Receivables)
      summary: Receive Swift Transfers (RTGS/IMT transactions)
      description: Automatcher accounts can be configurated to receive Swift Transfers. This includes both RTGS (Real Time Gross Settlement) and IMT (International Money Transfers). <br><br> If the account is not configured to receive Swift Transfers, the transaction will be automatically rejected on our end. If configured to allow RTGS/IMT transactions, a notification will be sent when an external party attempts to credit to one of your accounts, and if accepted, the funds will be credited to your sign in mAccount or nominated mAccount. Please contact Monoova for configuration of account. <br><br> Notification of a RTGS/IMT are sent via a <a href="/payments#operation/PendingInboundRtgsImt"> callback </a> or a <a href="/payments#operation/ReceivablesRTGSIMTReportDate"> report </a> API can be called to list all pending transactions. <br><br> After receiving a notification, you have 2 business days to either confirm or reject. If no action is taken the transaction will be placed into a pending status until expiry. <br><br> For expiring transactions, the RTGS/IMT transactions will automatically be actioned based on your account default configuration. <br><br> Configuration options are:<br><br> a)  Confirm - Accept all incoming RTGS/IMT Transactions<br> b)  Reject  - Reject all incoming RTGS/IMT Transactions <br><br>
      operationId: ReceivablesProcessRtgsImt
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/receivables.processrtgsimt'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/receivablesProcessDirectDebitResponse_V1'
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
  /receivables/v2/rtgsimtReport/{date}:
    get:
      tags:
      - Automatcher (Bank Account Receivables)
      summary: RTGS/IMT Report
      description: Returns a report of all received transactions for the day with associated details, this includes RTGS (real-time gross settlement) and International Money Transfer. If requested multiple times on the current date (calendar day, AEDT), the report is cumulative. E.g. if, on the same day, a report is requested at 10am and another one at 1pm, the report at 1pm will contain all the transactions already contained in the 10am report, in addition to any new transactions. <br/> <br/> The report is an application/octet-stream, columns are comma separated. Where a comma(,) or double quote(") is present in any of the below fields, the field will be encased in double quotes and/or escaped as per <a href="https://tools.ietf.org/html/rfc4180" target="_blank">RFC4180</a><br> Columns are as follows:&nbsp; <table class="tb"> <tr> <td class="td"> Transaction ID </td> <td class="td"> AccountNumber </td> <td class="td"> BSB </td> <td class="td"> AccountName </td> <td class="td"> TransactionReferenceNumber </td> <td class="td"> Amount </td> <td class="td"> Status </td> <td class="td"> LodgementRef </td> <td class="td"> Date </td> <td class="td"> SourceAccountDetails </td> <td class="td"> RespondBeforeDateTime </td> <td class="td"> RejectReasonDescription </td> <td class="td"> ProcessedDate </td> <td class="td"> SendingOrganisation </td> <td class="td"> ReceivingOrganisation </td> <td class="td"> OrderingInstitution </td> <td class="td"> OriginatingAddress </td> </tr> <tr> <td class="td"> <br/> <br/> Monoova generated <br/> Unique ID. <br/> Max 12 chars. <br/> <br/> <br/> </td> <td class="td"> Payee Bank Account <br/> Number. Max 34 chars. </td> <td class="td"> Payee BSB. <br/> Max 7 Chars. </td> <td class="td"> Payer submitted Account <br/> Name. Max 32 chars. </td> <td class="td"> TransactionReferenceNumber. <br/> Max 21 chars. </td> <td class="td"> Payment amount, <br/> 2 decimal places <br/> for cents. Max 11 chars. </td> <td class="td"> Transaction status, <br/> possible values:&nbsp; <br/> Pending, Confirmed and Rejected. </td> <td class="td"> Payer submitted reference. <br/> Max 280 chars. </td> <td class="td"> AEDT, Sydney. <br/> Max 27 chars. </td> <td class="td"> Source Account Name address and account number </td> <td class="td"> The time user has to Confirm/Reject a transaction. AEDT, Sydney. <br/> Max 27 chars. </td> <td class="td"> Reason why transaction was rejected. <br/> Max 500 chars. </td> <td class="td"> The time when transaction was Confirmed/Rejected. AEDT, Sydney. <br/> Max 27 chars. </td> <td class="td"> Sending Organisation. <br/> Max 100 chars. </td> <td class="td"> Receiving Organisation. <br/> Max 100 chars. </td> <td class="td"> Ordering Institution. <br/> Max 100 chars. </td> <td class="td"> Originating Address. <br/> Max 100 chars. </td> </tr> </table> <br/>
      operationId: ReceivablesRTGSIMTReportDate
      parameters:
      - name: date
        in: path
        required: true
        description: This becomes the start date of the report if report is being fetched for a date range. Date format should be 'yyyy-MM-dd' format.
        schema:
          type: string
          example: '2020-03-15'
      - name: endDate
        in: query
        required: false
        description: Use this to fetch the report for a date range. Date format should be 'yyyy-MM-dd' format
        schema:
          type: string
          example: '2020-04-08'
      - name: skip
        in: query
        required: false
        description: Number of records to skip. 1 is the first record.Value should be greater than 0
        schema:
          type: integer
          example: 1
      - name: take
        in: query
        required: false
        description: Number of records to take. If endDate is provided maximum take is 10000.
        schema:
          type: integer
          example: 1000
      responses:
        '200':
          description: OK
          content:
            text/plain:
              examples:
                response:
                  value: 'Transaction Id,Account Number,BSB,AccountName,Transaction Reference Number,Amount,Status,Lodgement Reference,Date,Source Account Details,Respond Before Date Time,Reject Reason Description,Processed Date,Sending Organisation,Receiving Organisation,Ordering Institution,Originating Address,ledgerAccountNumber,ledgerUniqueReference

