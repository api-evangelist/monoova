openapi: 3.2.0
info:
  description: '# Introduction


    Monoova has developed a powerful payments engine which allows you to receive, manage and pay funds in AUD in Australia automatically.'
  version: v5.29
  title: Monoova Payments Automatcher (Bank Account Receivables) API
  contact:
    name: Monoova Support
    email: support@monoova.com
    url: https://www.monoova.com
  x-logo:
    url: https://movdpwebsiteprodae.blob.core.windows.net/images/Monoova-Primary-Logo-Black-RGB.png
    altText: Monoova logo
servers:
- url: https://api.mpay.com.au
  description: Production URL
- url: https://api.m-pay.com.au
  description: Sandbox URL
security:
- BasicAuth: []
tags:
- name: Automatcher (Bank Account Receivables)
  description: 'Overview


    Having customers paying you by bank transfer might be easy for your customers but contains a reconciliation risk for you.'
paths:
  /receivables/v1/create:
    post:
      tags:
      - Automatcher (Bank Account Receivables)
      summary: Create an Automatcher (Receivables) Account
      description: Creates a new bank-account number. For the creation of batches of account numbers, please see /receivables/v1/batchCreate These account numbers can be used along with the returned BSB to receive payments from any bank in Australia. Payments to an invalid bank-account number, i.e. one that has not been created, will be returned by Monoova to the remitting institution. Each account number has a check digit to minimize common payer errors such as adjacent transposition errors or single-digit typos. An optional unique ID can be linked to each account number for your reference. If a unique ID is not provided, Monoova will generate and return one automatically. If isActive is omitted, it will default to false. This can be changed to true via the /receivables/v1/status endpoint.
      operationId: ReceivablesCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/receivables.create'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/receivablesCreateResponse_V1'
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
  /receivables/v1/status:
    post:
      tags:
      - Automatcher (Bank Account Receivables)
      summary: Set Account Status
      description: Bank accounts can be active or inactive. Inactive accounts will have all payments rejected and returned to the payer. Status can be called using either bank account number or clientuniqueId.
      operationId: ReceivablesStatus
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/receivables.status'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/receivablesStatusSetResponse_V1'
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
  /receivables/v1/statusByBankAccount/{bankAccountNumber}:
    get:
      tags:
      - Automatcher (Bank Account Receivables)
      summary: Get Account Status By BankAccount
      description: Returns the status of a bank account number. Without changing the status, this API is used for checking the status of a bank account. Status can be called using either bankaccount number or clientUniqueId.
      operationId: ReceivablesStatusByBank
      parameters:
      - name: bankAccountNumber
        in: path
        required: true
        description: The bank account number generated.
        schema:
          example: '153884104'
          type: string
      - name: bsb
        in: query
        required: false
        description: Optional BSB parameter specifying the branch identifier for Australian banks. Accepts either 6 digits or with a hyphen as "XXX-XXX". If not specified, the service will use the MAccount’s configured ‘Default BSB’. If a ‘Default BSB’ has not been configured, then the Monoova ‘Default BSB’ will be used.
        schema:
          type: string
          maxLength: 7
          example: 802-985
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/receivablesStatusGetResponse_V1'
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
  /receivables/v1/statusByClientID/{clientUniqueId}:
    get:
      tags:
      - Automatcher (Bank Account Receivables)
      summary: Get Account Status By ClientUniqueId
      description: 'Returns the status of a bank account number. Without changing the status, this API is used for checking the status of a bank account.

        Status can be called using either bankAccount number or clientUniqueId.'
      operationId: ReceivablesStatusByClientID
      parameters:
      - name: clientUniqueId
        in: path
        required: true
        description: An identifier assigned to the account.
        schema:
          example: 862944d057FC408B9B04541C2BA12
          type: string
      - name: bsb
        in: query
        required: false
        description: Optional BSB parameter specifying the branch identifier for Australian banks. Accepts either 6 digits or with a hyphen as "XXX-XXX". If not specified, the service will use the MAccount’s configured ‘Default BSB’. If a ‘Default BSB’ has not been configured, then the Monoova ‘Default BSB’ will be used.
        schema:
          type: string
          maxLength: 7
          example: 802-985
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/receivablesStatusGetResponse_V1'
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
  /receivables/v6/report/{date}:
    get:
      tags:
      - Automatcher (Bank Account Receivables)
      summary: Report
      description: Returns a report of all received transactions for the day with associated details, this includes Direct Entry and NPP Receivables.
      operationId: ReceivablesReportDate
      parameters:
      - name: date
        in: path
        required: true
        description: Format:&nbsp; 'yyyyMMddHHmmss'. This becomes the start date of the report if report is being fetched for a date range.
        schema:
          type: string
          example: '20200401000001'
      - name: endDate
        in: query
        required: false
        description: Format:&nbsp; yyyyMMddHHmmss. Use this to fetch the report for a date range.
        schema:
          type: string
          example: '20200408235959'
      - name: skip
        in: query
        required: false
        description: Number of records to skip. 0 is the first record.
        schema:
          type: integer
          example: 0
      - name: take
        in: query
        required: false
        description: Number of records to take. If endDate is provided maximum take is 10000.
        schema:
          type: integer
          example: 1000
      - name: accountNumber
        in: query
        required: false
        description: Payee bank account number.
        schema:
          type: string
          example: '123456789'
      - name: clientUniqueId
        in: query
        required: false
        description: The unique identifier for the account.
        schema:
          type: string
          example: 862944d057FC408B9B04541C2BA12
      - name: transactionType
        in: query
        required: false
        description: Possible Values:&nbsp; 'DE' or 'NPP'.
        schema:
          type: string
          example: DE
          enum:
          - DE
          - NPP
      - name: transactionCode
        in: query
        required: false
        description: Industry standard transaction code. only applicable for DE. Possible values:&nbsp; “13” for Debit, “50” for credit.Refer to Direct entry standard for definitions 51-57.
        schema:
          type: integer
          example: 13
          enum:
          - 13
          - 50
      - name: payId
        in: query
        required: false
        description: Email address for the PayID.
        schema:
          type: string
          example: xxx@xxx.xx
      - name: payIdName
        in: query
        required: false
        description: Name displayed to the payers.
        schema:
          type: string
          example: abcdefgh
      responses:
        '200':
          description: OK
          content:
            text/plain:
              examples:
                response:
                  value: 'Transaction ID, Batch Id, DateTime, BSB, AccountNumber, AccountName, PayId, PayId Name, TransactionCode, TransactionType, Amount, LodgementRef, RemitterName, Indicator, WithholdingTaxAmount, EndToEndId, RespondBeforeDateTime, NameOfUserSupplyingFile, NumberOfUserSupplyingFile, DescriptionOfEntriesOnFile, SourceBsb, SourceAccountNumber, SourceAccountName, CategoryPurposeCode, CreditorReferenceInformation, USINumber, USIScheme, UltimateCreditorName, ReconciliationRuleReference

                    D00100544414,000000214309,2020-04-20T13:58:48,802-985,744019924,CRMT,,,50,DE,5.00,Ref1,MONOOVA,,0.00,,,M PAYMENTS PTY LIMIT,483449,PAYMNT TRSFR,012-366,123456789,,,,,,RR22348

                    N00400000507,,2020-04-20T13:55:50,802-985,123456789,Ashwini Radcliffe,4op1q4@monoova.me,Test01,,NPP,201.00,This description,Twhite Pharma,,0.00,NOTPROVIDED,,,,,123-123,12026204,Twhite Pharma,,,,,,RR22349

                    N00400000494,,2020-04-20T13:55:17,802-985,123456789,Ashwini Radcliffe,4op1q4@monoova.me,Test01,,NPP,201.00,This description,Omega,,0.00,NOTPROVIDED,,,,,123-123,12026204,Omega Group,,,,,,RR22350

                    N00400000481,,2020-04-20T13:53:37,802-985,123456789,Ashwini Radcliffe,4op1q4@monoova.me,Test01,,NPP,201.00,This description,S Group,,0.00,NOTPROVIDED,,,,,123-123,12026204,S Group,,,,,,RR22351

                    '
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
  /paytoreceivables/v1/report/{date}:
    get:
      tags:
      - Automatcher (Bank Account Receivables)
      summary: PayTo Receivables Report
      description: 'Returns a report of PayTo transactions for the day with associated details. If requested multiple times on the current date (calendar day, AEDT), the report is cumulative. E.g. if, on the same day, a report is requested at 10am and another one at 1pm, the report at 1pm will contain all the transactions already contained in the 10am report, in addition to any new transactions. PayTo Transactions may arrive at anytime, we recommend subscribing to a webhook to receive new transaction notifications.


        The report is an application/octet-stream, columns are comma separated. Where a comma(,) or double quote(") is present in any of the below fields, the field will be encased in double quotes and/or escaped as per RFC4180

        Columns are as follows: .tb { table-layout:auto; width:100px;!important } .td { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; !important}


        Transaction ID Batch ID Datetime BSB AccountNumber AccountName PayId PayId Name TransactionCode TransactionType Amount LodgementRef RemitterName Indicator WithholdingTaxAmount (if applicable) EndToEndId RespondBeforeDateTime NameOfUserSupplyingFile NumberOfUserSupplyingFile DescriptionOfEntriesOnFile SourceBsb SourceAccountNumber SourceAccountName CategoryPurposeCode CreditorReferenceInformation USINumber USIScheme UltimateCreditorName MMSId InitiatingPartyName NPPInstructionId ReceiptNumber


        Monoova generated

        Unique ID.

        Max 12 chars.


        Payment Batch ID.

        Payments come in batches

        throughout the day.

        Max 12 chars. Blank if NPP. AEDT, Sydney.

        Max 27 chars. Payee BSB.

        Max 7 Chars. Payee Bank Account

        Number. Max 34 chars. Payer submitted Account

        Name. Max 32 chars. Email address for the PayID.

        Max 256 chars. Name displayed to the payers

        Max 140 chars. Industry standard transaction

        code. “50” for credit.

        Refer to Direct entry standard

        for definitions 51-57.

        Max 5 chars. Possible Values:

        ''DE'' or ''NPP''

        Payment amount,

        2 decimal places

        for cents. Max 11 chars. Payer submitted reference.

        Max 500 chars. Remitting Entity.

        Max 140 chars. Blank; OR ''W'' dividend paid to a

        resident of a country where a double

        tax agreement is in force. ''X'' dividend

        paid to a resident of any other country.

        ''Y'' interest paid to all non-resident.

        Max 1 chars. Blank OR Payment amount,

        2 decimal places for cents.

        Max 9 chars. Osko End to End identifier

        submitted by Payer. Time by when you have to

        respond to the Inbound

        Direct Debit request. Preferred name of the

        User supplying

        the Direct Entry file. This is the User Identification

        Number which is assigned by

        APCA and User Financial Institutions. Direct Entry file description.

        Payer BSB.

        Max 7 Chars.


        Payer Bank Account Number.

        Max 34 chars.

        This field appears for NPP transactions

        only and is the payers bank account name.

        For DE transactions please refer to the

        RemitterName Field. Max 140 Chars.

        NPP payment purpose code, max 4 chars.

        Possible values:

        Blank,

        SALA = Salary,

        PENS = SuperAnnuation,

        SUPP = E-Invoice,

        TAXS = Tax Used for SALA, PENS, SUPP and TAXS

        transactions only.

        Reference related to payment type.

        Max 35 chars. Used for PENS code payments only.

        Unique Superannuation ID (USI)

        Max 35 chars. Used for PENS code payments only.

        USI scheme.

        Max 35 chars. Used for PENS code payments only.

        Name of the Ultimate Creditor.

        Max 140 chars. Id assigned by NPPA for payment agreement Iniation Party name.

        Unique identifier for the NPP instruction.

        Max 35 chars. Unique identifier for the transaction log.

        Max 12 chars.


        Note: Source account details do not appear by default, please contact Monoova for further information. Also note, we will only retrieve 1 month transaction at a time


        Possible transaction codes


        Code Transaction Description


        13 Externally initiated debit items


        50 Externally initiated credit items with the exception of those bearing Transaction Codes


        51 Australian Government Security Interest


        52 Family Allowance


        53 Pay


        54 Pension


        55 Allotment


        56 Dividend


        57 Debenture/Note Interest'
      operationId: PayToReceivablesReportDate
      parameters:
      - name: date
        in: path
        required: true
        description: Format:&nbsp; 'yyyyMMddHHmmss'. This becomes the start date of the report if report is being fetched for a date range.
        schema:
          type: string
          example: '20200401000001'
      - name: endDate
        in: query
        required: false
        description: Format:&nbsp; yyyyMMddHHmmss. Use this to fetch the report for a date range.
        schema:
          type: string
          example: '20200408235959'
      - name: skip
        in: query
        required: false
        description: Number of records to skip. 0 is the first record.
        schema:
          type: integer
          example: 0
      - name: take
        in: query
        required: false
        description: Number of records to take. If endDate is provided maximum take is 10000.
        schema:
          type: integer
          example: 1000
      - name: accountNumber
        in: query
        required: false
        description: Payee bank account number.
        schema:
          type: string
          example: '123456789'
      - name: clientUniqueId
        in: query
        required: false
        description: The unique identifier for the account.
        schema:
          type: string
          example: 862944d057FC408B9B04541C2BA12
      - name: transactionType
        in: query
        required: false
        description: Possible Values:&nbsp; 'DE' or 'NPP'.
        schema:
          type: string
          example: DE
          enum:
          - DE
          - NPP
      - name: transactionCode
        in: query
        required: false
        description: Industry standard transaction code. only applicable for DE. Possible values:&nbsp; “13” for Debit, “50” for credit.Refer to Direct entry standard for definitions 51-57.
        schema:
          type: integer
          example: 13
          enum:
          - 13
          - 50
      - name: payId
        in: query
        required: false
        description: Email address for the PayID.
        schema:
          type: string
          example: xxx@xxx.xx
      - name: payIdName
        in: query
        required: false
        description: Name displayed to the payers.
        schema:
          type: string
          example: abcdefgh
      responses:
        '200':
          description: OK
          content:
            text/plain:
              examples:
                response:
                  value: 'Transaction ID,Batch Id,DateTime,BSB,AccountNumber,AccountName,PayId,PayId Name,TransactionCode,TransactionType,Amount,LodgementRef,RemitterName,Indicator,WithholdingTaxAmount,EndToEndId,RespondBeforeDateTime,NameOfUserSupplyingFile,NumberOfUserSupplyingFile,DescriptionOfEntriesOnFile,SourceBsb,SourceAccountNumber,SourceAccountName,CategoryPurposeCode,CreditorReferenceInformation,USINumber,USIScheme,UltimateCreditorName,MMSId,InitiatingPartyName,NPPInstructionId,ReceiptNumber

                    N00400000507,,2020-04-20T13:55:50,802-985,123456789,Ashwini Radcliffe,4op1q4@monoova.me,Test01,,NPP,201.00,This description,Twhite Pharma,,0.00,NOTPROVIDED,,,,,123-123,12026204,Twhite Pharma,,,,,,,PI123456789,5678120

                    N00400000494,,2020-04-20T13:55:17,802-985,123456789,Ashwini Radcliffe,4op1q4@monoova.me,Test01,,NPP,201.00,This description,Omega,,0.00,NOTPROVIDED,,,,,123-123,12026204,Omega Group,,,,,,,PI123456790,5678121

                    N00400000481,,2020-04-20T13:53:37,802-985,123456789,Ashwini Radcliffe,4op1q4@monoova.me,Test01,,NPP,201.00,This description,S Group,,0.00,NOTPROVIDED,,,,,123-123,12026204,S Group,,,,,,,PI123456791,5678122

                    '
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
  /receivables/v1/reportLastSettlement:
    get:
      tags:
      - Automatcher (Bank Account Receivables)
      summary: Last Settlement
      description: Returns the latest settlement for received funds. We suggest using this as a lightweight polling endpoint to establish when new transactions have been received. Transactions arrive in batches.
      operationId: ReceivablesReportLastSettlement
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/receivablesReportLastSettlement_V1'
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
  /receivables/v1/listAccounts:
    get:
      tags:
      - Automatcher (Bank Account Receivables)
      summary: List Accounts
      description: List Accounts will return a list of all account numbers you have linked to your Sign in.
      operationId: ReceivablesListAccounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/receivablesListAccounts_V1'
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
  /receivables/v1/batchCreate:
    post:
      tags:
      - Automatcher (Bank Account Receivables)
      summary: Batch Create
      description: 'The batch create API has the same functionality as the /receivables/v1/create endpoint however it allows you to create up to 50,000 accounts in a single call by submitting a file. We recommend this for circumstances where > 100 accounts need to be created within a short time period.

        Creation of accounts with isActive=true is restricted to 1000. Multiple batches cannot be requested at the same time, you have to wait for the completion of a batch before requesting a new one.

        The Batch Create API also supports a lightweight option whereby many accounts can be created by submitting a single line. This option automatically sets isActive = true, hence you can only request the creation of 1000 accounts in one request. For this method, all accounts will be created with the same specified name, and clientuniqueid’s cannot be specified will be automatically generated.'
      operationId: ReceivablesBatchCreate
      x-codeSamples:
      - lang: Detail example
        source: '[bankAccountName,clientUniqueId,isActive,bsb]

          [Bank14399997,S45D927DA07094859A5E5B1E532A12CA,true,802-985]

          [Bank14399997,K275D304BE0B947829224BE7BC8A6AEF,true,802-985]

          [Bank14399997,T13686BC4B7364A13AE092A2CA1DFCF6,true,802-985]

          [Bank12399997,SHU13LJ6Z0356ZWAZPTFTQ0K6VZQG2NO,false,802-985]

          '
      - lang: Lightweight example
        source: '[bankAccountName,count,bsb]

          [My company pty ltd,4,802-985]

          '
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              description: "Batch create requires parameters to be submitted as a file, with headers. The header and each new record are enclosed in square brackets.\nThe columns are comma separated with the following format:\n<br/>\n<br/>\n<br/>\nDetail example\n<table class=\"tb\">\n<tr>\n<td class=\"td\"> bankAccountName </td>\n<td class=\"td\"> clientUniqueId </td>\n<td class=\"td\"> isActive </td>\n<td class=\"td\"> bsb </td>\n</tr>\n<tr>\n<td class=\"td\">\n<br/> <br/>\nThe name of the account to be paid into. <br/>\nThis will be defaulted to your registered Trading Name. <br/>\n<br/> <br/>\n</td>\n<td class=\"td\">\nAn identifier assigned to the account. <br/>\nMust be unique. <br/>\nIf not provided Monoova will generate and <br/>\nreturn a value automatically. <br/>\n</td>\n<td class=\"td\">\nUsed to open and close account numbers. <br/>\nClosed account numbers will return all payments <br/>\nmade to that account number. <br/>\nIf not provided this value defaults to false. <br/>\n</td>\n<td class=\"td\">\nOptional. If this column is added, please provide a valid value.\n</td>\n</tr>\n</table> <br/>\n\nLightweight example\n<table class=\"tb\">\n<tr>\n<td class=\"td\"> bankAccountName </td>\n<td class=\"td\"> count </td>\n<td class=\"td\"> bsb </td>\n</tr>\n<tr>\n<td class=\"td\">\n<br/> <br/>\nThe name of the account to be paid into. <br/>\nThis will be defaulted to your registered Trading Name. <br/>\n<br/> <br/>\n</td>\n<td class=\"td\">\nNumeric, number of accounts you wish to create with this name. <br/>\n</td>\n<td class=\"td\">\nOptional. If this column is added, please provide a valid value.\n</td>\n</tr>\n</table> <br/>\n<td class=\"td\">\n  Optional BSB parameter. If not specified, default BSB logic applies.\n</td>\n</tr>\n</table>\n"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/receivablesBatchCreate_V1'
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
  /receivables/v1/batchStatus:
    post:
      tags:
      - Automatcher (Bank Account Receivables)
      summary: Batch Status
      description: 'The batch Status API functions similarly to the /receivables/v1/Status API,

        however it allows you to update accounts in batch.

        You can only update 1000 records per request. Multiple batches cannot be requested at the same time,

        you have to wait for the completion of a batch before requesting a new one.'
      operationId: ReceivablesbatchStatus
      x-codeSamples:
      - lang: Payload
        source: '[clientUniqueId,bankAccountNumber,isActive,bsb]

          [A55117D53057E449D83CB49CE3D3FCC87,21316015,true,802-985]

          [E0DF9007BF4064F0D819EA0663AB11107,52463879,true,]

          [F1608858214894DD9BE5565A10A28053F,32597641,false,]

          [F2B512D8FE7F4AEFB82EA97141B710CFE,15402587,true,]

          [TR1268FA85FCED4E9793B57E71F985AD2,81225401,true,]

          [D308A7F0B8CD4C909CCEAC2CEDD624917,41900918,true,]

          [KO22043D20EEF847209A9E50D86F915E0,67953481,true,]

          [MP578B76FC71574A4BAF848D94268970F,71828803,true,]

          '
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              description: 'Batch status requires parameters to be submitted as a file, the header and each new record are enclosed in square brackets.

                The columns are comma separated with the following format:

                <table class="tb">

                <tr>

                <td class="td"> clientUniqueId </td>

                <td class="td"> bankAccountNumber </td>

                <td class="td"> isActive </td>

                <td class="td"> bsb </td>

                </tr>

                <tr>

                <td class="td">

                The unique identifier for the account to open or close. <br/>

                `at least one of clientUniqueId or bankAccountNumber`<br/>

                `required` <br/>

                </td>

                <td class="td">

                <br/> <br/>

                The bank account number for the account to open or close. <br/>

                `at least one of clientUniqueId or bankAccountNumber`<br/>

                `required` <br/>

                <br/> <br/>

                </td>

                <td class="td">

                Used to open and close account numbers. <br/>

                Closed account numbers will return all payments <br/>

                made to that account number. <br/>

                </td>

                <td class="td">

                Optional BSB parameter. If not specified, default BSB logic applies.

                </td>

                </tr>

                </table>

                '
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/receivablesBatchStatus_V1'
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
  /receivables/v2/refund:
    post:
      tags:
      - Automatcher (Bank Account Receivables)
      summary: Receivables Refund
      description: The refund API allows the transfer funds back to the payer for transactions received via EFT. The funds are sent to details as supplied by the payer institution. Please note that not all institutions provide valid payer details, in some cases the refund will not be successful. NPP payments can only be refunded 5 minutes after receiving the original payment.
      operationId: ReceivablesRefund
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/receivables.refund'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/receivablesRefundResponse_V1'
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
  /receivables/v1/processdirectdebit:
    post:
      tags:
      - Automatcher (Bank Account Receivables)
      summary: Process Direct Debit
      description: 'Automatcher accounts can also process direct debits from external organisations against them. By default this behaviour is disabled. If configured to allow direct debits, a notification will be sent when an external party attempts to debit one of your accounts, and if accepted, the funds will be deducted from your sign in mAccount.


        Notification of a pending direct debit are sent via a callback or a report API can be called to list all pending debits.


        After receiving a notification, you have until 4:00pm next business day (from the time the initial debit is received) to instruct us on what action to take; either approve or reject. If no action is taken the transaction will be placed into a pending status until expiry next business day at 4pm.


        For expiring transactions, the direct debit request will automatically be actioned based on your account default configuration.


        Configuration options are:


        a) Accept direct debit request for all requests

        b) Reject direct debit for all requests


        Note if you do not have sufficient balance in your sign in mAccount you cannot accept direct debits and expiring direct debits will be automatically returned regardless of configuration.'
      operationId: ReceivablesProcessDirectDebit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/receivables.processdirectdebit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/receivablesProcessDirectDebitResponse_V1'
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
