tags:
- name: Reporting
  description: '</br><h2>PayTo Reporting</h2> <p> A new report has been added specifically for NPP payments related to PayTo. Monoova’s PayTo NPP receivables – available <a href=''https://api-docs.monoova.com/payments#operation/PayToReceivablesReportDate'' target=''_blank''> here </a>

    </p> </br> In addition, PayTo NPP receivables will have the following additional data fields </br> <style type="text/css"> .tb { table-layout:auto; width:300px;!important } .td { overflow:hidden; white-space:nowrap; text-overflow:ellipsis!important} </style> <table class="tb"> <tr> <th> Field </th> <th> Description </th> <th> Specification </th> </tr>

    <tr> <td class="td">

    mmsId <br/> </td> <td class="td"> Id assigned by NPPA for payment agreement <br/> </td> <td class="td"> string{33} <br/> </td> </tr> <tr> <td class="td">

    InitiatingPartyName <br/> </td> <td class="td"> Initiating Party name.. <br/> </td> <td class="td"> string{1, 35} <br/> </td> </tr> </table>'
paths:
  /au/payto/pam-v1/PaymentAgreement:
    get:
      tags:
      - Reporting
      summary: Get Payment Agreements by Date Range
      description: Previously created Payment Agreements can be retrieved individually date range.
      operationId: get-paymentagreement
      parameters:
      - name: createdStartDate
        in: query
        required: true
        description: Start Date. </br>Required. ISO8601 date-time
        schema:
          type: string
          format: date-time
      - name: pageNumber
        in: query
        description: Page to be returned after records are split as per pageSize. <br/> Optional, If not provided, it is defaulted to 1.
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: Number of records per page. </br> Optional, If not provided page size will be defaulted to 50. Maximum allowed value is 200.
        schema:
          type: integer
          format: int32
      - name: createdEndDate
        in: query
        description: End Date. Optional, if not provided it will be defaulted to createdStartDate +24 hours. ISO8601 date-time
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAgreementsListResponse'
        '400':
          description: Error
          content:
            application/json:
              example:
                traceId: f1a7fbd7-ca39-4b98-b247-f4e0e004f152
                errors:
                - errorCode: string
                  errorMessage: string
        '403':
          description: Error
          content:
            application/json:
              example:
                traceId: f1a7fbd7-ca39-4b98-b247-f4e0e004f152
                errors:
                - errorCode: string
                  errorMessage: string
        '404':
          description: Error
          content:
            application/json:
              example:
                traceId: f1a7fbd7-ca39-4b98-b247-f4e0e004f152
                errors:
                - errorCode: string
                  errorMessage: string
        '500':
          description: Error
          content:
            application/json:
              example:
                traceId: f1a7fbd7-ca39-4b98-b247-f4e0e004f152
                errors:
                - errorCode: string
                  errorMessage: string
        '502':
          description: Error
          content:
            application/json:
              example:
                traceId: f1a7fbd7-ca39-4b98-b247-f4e0e004f152
                errors:
                - errorCode: string
