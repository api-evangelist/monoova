        bsb:
          type: string
          example: 123-123
          maxLength: 7
          description: Payee BSB.
        accountNumber:
          type: string
          example: '818123123'
          maxLength: 34
          description: Payee Bank Account Number.
        accountName:
          type: string
          example: test@test.io
          maxLength: 32
          description: Payee submitted Account Name.
        payId:
          type: string
          example: test@test.io
          maxLength: 256
          description: Email address for the PayID.
        payIdName:
          type: string
