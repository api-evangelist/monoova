servers:
- url: https://api.mpay.com.au
  description: Production URL
- url: https://api.m-pay.com.au
  description: Sandbox URL
security:
- BasicAuth: []
tags:
- name: Public Endpoints
  description: ''
paths:
  /public/v1/ping:
    get:
      tags:
      - Public Endpoints
      summary: Ping
      description: The primary purpose of the ping API is to validate that the system is up and running. No Authentication is required.
      operationId: PublicPing
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DTO.PublicPingResponse_V1'
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
  /public/v1/certificate:
    get:
      tags:
      - Public Endpoints
      summary: Webhook Signing Certificate
      description: 'This endpoint returns the current X.509 certificate, which contains the public key that you can use to verify messages sent by Monoova.</br>

        The certificate returned is short-lived (1-year validity) and should be updated accordingly.

        </br></br>

        '
      operationId: PublicCertificate
      security: []
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
  /public/v1/certificate/public-key:
    get:
      tags:
      - Public Endpoints
      summary: Retrieve Public Key
      description: This endpoint returns the public key used by Monoova to sign messages.The public key is encoded as a hexadecimal string.</br> This public key should be expected to change every 1 year and should be updated accordingly.
      operationId: PublicCertificatePublicKey
      security: []
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              examples:
                response:
                  value: 
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
components:
  schemas:
    DTO.PublicPingResponse_V1:
      properties:
        durationMs:
          description: 'This value represents the total time in milliseconds that the Platform took to process the request. '
          type: integer
          format: int64
          example: 20
          uniqueItems: false
        status:
          description: This is the status of executing the request.&nbsp;A code of ‘Ok’ indicates no errors
          type: string
          example: Ok
          uniqueItems: false
        statusDescription:
          description: This is a plain English description of the status.
          type: string
          example: Operation completed successfully
          uniqueItems: false
        version:
          description: A string containing the Version of the Platform engine with the current Date Time at the server
          type: string
          example: 'Monoova Payments Platform Public V1.0.Engine V: 4.74.0.0  Environment: Sandbox DateTime: 19-Nov-2018 06:54:48 AM'
          uniqueItems: false
        environment:
          description: 'The name of the environment you are connected too: ·Live ·Sandbox'
          type: string
          example: Sandbox
          uniqueItems: false
      type: object
      format: DTO.PublicPingResponse_V1
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
