components:
  schemas:
    PaymentInitiationDetailsDto:
      type: object
      required:
      - amount
      properties:
        amount:
          type: string
          description: Amount to be transferred. Amount should be >=0.01
          maxLength: 34
        isLastPayment:
          type:
          - boolean
          - 'null'
          description: Set to true to indicate this is the last payment initiation request associated with the mandate. Possible values - True, False.
        lodgementReference:
          type:
          - string
          - 'null'
          description: Unique reference, as assigned by the creditor, to unambiguously refer to the payment transaction.
          maxLength: 280
      additionalProperties: false
    AmendUnilateralDetailsDto:
      type: object
      properties:
        description:
          type:
          - string
          - 'null'
          description: Reason for the mandate setup as narrative text.</br> Either "description" or "short_description" must be present.
          maxLength: 140
          example: payroll pag1
        shortDescription:
          type:
          - string
          - 'null'
          description: Reason for the mandate setup as narrative text.</br> Either "description" or "short_description" must be present.
          maxLength: 35
          example: payroll pag1
        payeeDetails:
          $ref: '#/components/schemas/PayeeDetailsDto'
      additionalProperties: false
    AsyncInitiationRequestFailedResponse:
      type: object
      properties:
        traceId:
          type: string
          description: Error log trace identifier.
          example: c0905f60-80b7-4a6a-abe3-0207b3e19b8e
        uniqueRequestId:
          type: string
          description: Server generated unique request identifier.
          example: 595a3202-e9aa-406e-a2a3-5efb6ca8b72a
        paymentInitiationUID:
          type: string
          description: User supplied PIR identifier.
          example: MONPIR1673930138
        status:
          type: string
          description: Final status of the request indicating failure.
          example: Failed
        errorCode:
          type: string
          description: Error code indicating the reason for failure.
          example: MOV_UNEXPECTED_VALIDATION_FAILURE
        errorMessage:
          type: string
          description: Detailed message explaining the reason for failure.
          example: Validation failed with banking partner. Contact Monoova for more information
    InitiateMandatePaymentDto:
      type: object
      required:
      - paymentAgreementUID
      - paymentInitiationUID
      - paymentDetails
      properties:
        paymentAgreementUID:
          type:
          - string
          - 'null'
          maxLength: 35
          description: Id to uniquely Identify a payment agreement.
        paymentInitiationUID:
          type:
          - string
          - 'null'
          maxLength: 35
          description: Id to uniquely identify payment
        payeeDetails:
          $ref: '#/components/schemas/PayeeDetailsDto'
        paymentDetails:
          $ref: '#/components/schemas/PaymentInitiationDetailsDto'
      additionalProperties: false
    CreatePaymentAgreementDto:
      type: object
      required:
      - paymentAgreementUID
      properties:
        paymentAgreementUID:
          type: string
          description: Id to uniquely Identify a payment agreement.
          maxLength: 35
          pattern: ^[A-Z0-9_-]
          example: ABCORP123456
        payeeDetails:
          $ref: '#/components/schemas/PayeeDetailsDto'
        payerDetails:
          $ref: '#/components/schemas/PayerDetailsDto'
        paymentTerms:
          $ref: '#/components/schemas/PaymentTermsDto'
        paymentDetails:
          $ref: '#/components/schemas/PaymentDetailsDto'
      additionalProperties: false
    AsyncMandateRequestFailedResponse:
      type: object
      properties:
        traceId:
          type: string
          description: Error log trace identifier.
          example: c0905f60-80b7-4a6a-abe3-0207b3e19b8e
        uniqueRequestId:
          type: string
          description: Server generated unique request identifier.
          example: 595a3202-e9aa-406e-a2a3-5efb6ca8b72a
        paymentAgreementUID:
          type: string
          description: User supplied PAG identifier.
          example: MONPAG1673930138
        status:
          type: string
          description: Final status of the request indicating failure.
          example: Failed
        errorCode:
          type: string
          description: Error code indicating the reason for failure.
          example: MOV_UNEXPECTED_VALIDATION_FAILURE
        errorMessage:
          type: string
          description: Detailed message explaining the reason for failure.
          example: Validation failed with banking partner. Contact Monoova for more information
    AmendPaymentAgreementStatusDto:
      type: object
      properties:
        paymentAgreementUID:
          type: string
          description: 'Unique ID of the payment agreement.

            '
        statusChange:
          type: string
          description: The status that you wish to change the payment agreement to. </br> <strong> Note&#58;</strong> You cannot change a status from ‘Created’ to ‘Cancel’. If you wish to recall a payment agreement before the payer has approved it, you need to use the Recall Agreement endpoint.</b> </br> <style type="text/css"> .tb { table-layout:auto; width:300px;!important } .td { overflow:hidden; white-space:nowrap; text-overflow:ellipsis!important} </style> <table class="tb"> <tr> <th> Current Status </th> <th> Payload Status </th> <th> New Status </th> <th> Note </th> </tr> <tr><td>    Active    </td><td>    Cancel    </td> <td>    Cancelled    </td><td>    Reason Code is mandatory.    </td></tr> <tr><td>    Active     </td><td>    Pause    </td><td>    Paused    </td><td>    Reason Code is mandatory.    </td></tr> <tr><td>    Paused    </td><td>    Resume    </td><td>    Active    </td><td>    Only party who suspended can Activate payment agreement    </td></tr> <tr><td>    Paused    </td><td>    Cancel    </td><td>    Cancelled    </td><td>    Reason Code is mandatory.    </td></tr> <tr><td>    Cancel    </td><td>-</td><td>-</td><td>    This is the final status    </td></tr> </table>
        reasonCode:
          type: string
          description: 'Reason code for changing the agreement status. Must be provided when the status is `Cancel` or `Pause`.

            '
          example: AC02
        reasonDescription:
          type: string
          description: 'Description of the reason for the change in status.

            '
          example: Invalid Debtor Account Number
          maxLength: 256
    AmendBilateralDetailsDto:
      type: object
      properties:
        automaticRenewal:
          type:
          - boolean
          - 'null'
        endDate:
          type:
          - string
          - 'null'
          description: End date of the validity of the mandate. If specified, the mandate is valid until 23:59:59.999 Australia Sydney time on this date.
        respondByTime:
          type:
          - string
          - 'null'
          format: date-time
          description: Optional time used to indicate by when resolution of a bilateral action is requested from the other party to the payment agreement. It will be provided in any notification sent to the counterparty. This time is for informational purposes only and does not affect the expiry time imposed by the MMS. Must be future date and less than 5 days If not provided value will be defaulted to agreement creation datetime + 5 day Default time zone is UTC
        paymentTerms:
          $ref: '#/components/schemas/PaymentTermsDto'
      additionalProperties: false
    SuccessAgreementAsyncResponse:
      type: object
      properties:
        traceId:
          type: string
          description: Error log trace identifier.
          example: c0905f60-80b7-4a6a-abe3-0207b3e19b8e
        uniqueRequestId:
          type: string
          description: Server generated unique request identifier.
          example: 595a3202-e9aa-406e-a2a3-5efb6ca8b72a
        paymentAgreementUID:
          type: string
          description: User supplied PAG identifier.
          example: MONPAG1673930138
        status:
          type: string
          description: Final status of the request.
          example: Completed
    PaymentDetailsDto:
      required:
      - automaticRenewal
      - purpose
      - startDate
      properties:
        automaticRenewal:
          type:
          - boolean
          - 'null'
          example: false
          description: Determines if the payment agreement automatically renews at the end of the defined period. </br> Possible values - True, False </br> endDate cannot be present if automaticRenewal is set as 'TRUE', endDate must be present if automaticRenewal is set as 'FALSE'
        description:
          type:
          - string
          - 'null'
          description: Reason for the mandate setup as narrative text. </br> Either "description" or "short_description" must be present
          maxLength: 140
          example: null
        shortDescription:
          description: Reason for the mandate setup as narrative text. </br> Either "description" or "short_description" must be present
          type:
          - string
          - 'null'
          maxLength: 35
          example: PayToTest_001
        purpose:
          type:
          - string
          - 'null'
          description: Payment Purpose Code. </br>  Possible Values- </br>  MORT - Mortgage Payments </br>  UTIL - Utility Payments </br>  LOAN - Loan Payments </br>  DEPD - Dependant Support Payments </br>  GAMP - Gambling Payments </br>  RETL - Retail Payments </br>  SALA - Salary Payments </br>  PERS - Personal Payment </br>  GOVT - Government Payments </br>  PENS - Pension Payments </br>  TAXS - Tax Payments </br>  OTHR - Other Service Payments
          example: MORT
        respondByTime:
          type:
          - string
          - 'null'
          description: Optional time used to indicate by when resolution of a bilateral action is requested from the other party to the payment agreement. It will be provided in any notification sent to the counterparty. This time is for informational purposes only and does not affect the expiry time imposed by the MMS.<br/>Must be future date and less than 5 days<br/> If not provided value will be defaulted to agreement creation datetime + 5 day<br/> Default time zone is UTC
          format: ISODateTime ( yyyy-mm-ddThh:mm:ss+|–hh:mm)
          example: 2022-09-13 14:35:27+00:00
        startDate:
          description: Start date of the validity of the mandate. The mandate is valid as of 00:00:00.000 Australia Sydney time on this date.
          type:
          - string
          - 'null'
          format: YYYY-MM-DD
          example: 2022-09-13
        endDate:
          type:
          - string
          - 'null'
          format: YYYY-MM-DD
          example: 2023-08-24
          description: End date of the validity of the mandate. If specified, the mandate is valid until 23:59:59.999 Australia Sydney time on this date.
      additionalProperties: false
    PayeeDetailsDto:
      required:
      - payeeType
      oneOf:
      - required:
        - payeeLinkedBsb
        - payeeLinkedAccount
      - required:
        - payeeLinkedPayId
        - payeeLinkedPayIdType
        - payeeAccountName
      type: object
      properties:
        payeeType:
          type:
          - string
          - 'null'
          description: Identifies the type of a party.</br> Possible Values ORGN - Organization, PERS - Person
          example: ORGN
        payeeLinkedBsb:
          type:
          - string
          - 'null'
          description: BSB number. </br>Required if 'payeeLinkedPayId' and 'payeeLinkedPayIdType' are not provided. e.g. '999-999 or 999999'
          example: 999-999
        payeeLinkedAccount:
          type:
          - string
          - 'null'
          maxLength: 28
          description: Bank Account Number. </br>Required if 'payeeLinkedPayId' and 'payeeLinkedPayIdType' are not provided.
          example: 22222222
        payeeLinkedPayId:
          type:
          - string
          - 'null'
          description: PayID. </br> Email, phone number, ABN, ACN or Organisation name. </br>Required if 'payeeLinkedBsb' and 'payeeLinkedAccount' are not provided. <a href="/payTo#tag/PAYID-Format-Validation">See PAYID Format Validation.</a>
          example: ''
        payeeLinkedPayIdType:
          type:
          - string
          - 'null'
          description: PayID Type. Possible values ABN, Email, PhoneNumber, OrganisationId, ACN. </br>Required if 'payeeLinkedBsb' and 'payeeLinkedAccount' are not provided.
          example: ''
        payeeAccountName:
          type:
          - string
          - 'null'
          description: Bank Account Name </br> Can only provide payeeAccountName in the payload if crediting an external BSB. Mandatory if crediting a PayID.
          maxLength: 140
          example: ABCORP
        ultimatePayee:
          type:
          - string
          - 'null'
          example: ABCORP
          description: Name by which the party is known, and which is usually used to identify that party.</br> Can only provide ultimatePayee in the payload if crediting an external BSB.
      additionalProperties: false
    PendingAgreementAsyncResponse:
      type: object
      properties:
        traceId:
          type: string
          description: Trace identifier.
          example: be393fae-52c2-4c9e-a262-4974de6da750
        uniqueRequestId:
          type: string
          description: Server generated unique request identifier.
          example: 4834dba5-27b0-465c-aea7-aa530315c68c
        paymentAgreementUID:
          type: string
          description: User supplied PAG identifier.
          example: MONPAG1673935776
        status:
          type: string
          description: Current status of the request.
          example: Processing
    SuccessInitiationAsyncResponse:
      type: object
      properties:
        traceId:
          type: string
          description: Error log trace identifier.
          example: c0905f60-80b7-4a6a-abe3-0207b3e19b8e
        uniqueRequestId:
          type: string
          description: Server generated unique request identifier.
          example: 595a3202-e9aa-406e-a2a3-5efb6ca8b72a
        paymentInitiationUID:
          type: string
          description: User supplied PIR identifier.
          example: MONPIR1673930138
        status:
          type: string
          description: Final status of the request.
          example: Completed
    PayerDetailsDto:
      type: object
