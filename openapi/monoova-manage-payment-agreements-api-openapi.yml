  /au/payto/pam-v1/paymentagreement/{paymentAgreementUID}/status:
    patch:
      tags:
      - Manage Payment Agreements
      summary: Amend Payment Agreement Status
      description: 'This endpoint allows the initiator to change the status of a payment agreement. Available statuses are `active`, `pause`, or `cancel`.


        Status Reason Code


        .tb { table-layout:auto; width:200px;!important }

        .td { overflow:hidden; white-space:nowrap; text-overflow:ellipsis!important}


        Code Reason


        AC02Invalid Debtor Account Number


        AC04Closed Account Number


        AC05Closed Debtor Account Number


        AC06Blocked Account


        AC13Invalid Debtor Account Type


        AG01Transaction Forbidden


        AG03Transaction Not Supported


        AM03Not Allowed Currency


        AM12Invalid Amount


        AM14Amount Exceeds Agreed Limit


        CTAMContract Amended


        CTCAContract Cancellation Initiated By Debtor


        CTEXContract Expired


        MCFCPayment Agreement Suspended Final Collection


        MCOCPayment Agreement Suspended Once Off Collection


        MD07End Customer Deceased


        MD08No Payment Agreement Service By Agent


        MD09No Payment Agreement Service On Customer


        MD16Requested By Customer


        MD17Requested By Initiating Party


        MD20Payment Agreement Expired


        MD21Payment Agreement Cancelled Due To Fraud


        MS02Not Specified Reason Customer Generated


        MS03Not Specified Reason Agent Generated


        MSUCPayment Agreement Suspended 7 Consecutive Unsuccessful Collections


        NARRNarrative


        NOASNo Answer From Customer


        RR04Regulatory Reason


        SL01Specific Service Offered By Debtor Agent


        SL11Creditor Not On Whitelist Of Debtor


        SL12Creditor On Blacklist Of Debtor'
      operationId: patch-paymentagreement-id-status
      parameters:
      - name: paymentAgreementUID
        in: path
        required: true
        schema:
          type: string
          description: Id to uniquely identify a payment agreement.
          maxLength: 35
          pattern: ^[A-Za-z0-9_-]{1,35}$
          example: MONPAG12345
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmendPaymentAgreementStatusDto'
            example:
              statusChange: pause
              reasonCode: AC02
              reasonDescription: Amend mandate status
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmendPaymentAgreementStatusResponse'
        '400':
          description: Error
          content:
            application/json:
              example:
                traceId: f1a7fbd7-ca39-4b98-b247-f4e0e004f152
                errors:
                - errorCode: string
                  errorMessage: string
        '403':
          description: Error
          content:
            application/json:
              example:
                traceId: f1a7fbd7-ca39-4b98-b247-f4e0e004f152
                errors:
                - errorCode: string
                  errorMessage: string
        '404':
          description: Error
          content:
            application/json:
              example:
                traceId: f1a7fbd7-ca39-4b98-b247-f4e0e004f152
                errors:
                - errorCode: string
                  errorMessage: string
        '500':
          description: Error
          content:
            application/json:
              example:
                traceId: f1a7fbd7-ca39-4b98-b247-f4e0e004f152
                errors:
                - errorCode: string
                  errorMessage: string
        '502':
          description: Error
          content:
            application/json:
              example:
                traceId: f1a7fbd7-ca39-4b98-b247-f4e0e004f152
                errors:
                - errorCode: string
                  errorMessage: string
        '504':
          description: Error
          content:
            application/json:
              example:
                traceId: f1a7fbd7-ca39-4b98-b247-f4e0e004f152
                errors:
                - errorCode: string
                  errorMessage: string
  /au/payto/pam-v1/paymentAgreement/{PaymentAgreementUID}/recall/{actionIdentification}:
    patch:
      tags:
      - Manage Payment Agreements
      summary: Recall a Payment Agreement
      description: The purpose of this operation is to recall a pending payment agreement before it is approved or declined by the payer servicer/customer.
      operationId: patch-paymentagreement-id-recall
      parameters:
      - name: PaymentAgreementUID
        in: path
        required: true
        schema:
          type: string
          maxLength: 35
          pattern: ^[A-Za-z0-9_-]
          description: Id to uniquely Identify a payment agreement.
          example: MONPAG12345
      - name: actionIdentification
        in: path
        required: true
        schema:
          type: string
          maxLength: 35
          pattern: ^[a-f0-9]{12}1[a-f0-9]{3}[89ab][a-f0-9]{15}$
          description: unique Id used to identify pending(unapproved) actions. This id is assigned when a new payment agreement is created or when a bilateral amendment is made.
          example: 6ae818a80bc362618aeaece46ee70e4a
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecallPaymentAgreementLastActionResponse'
        '400':
          description: Error
          content:
            application/json:
              example:
                traceId: f1a7fbd7-ca39-4b98-b247-f4e0e004f152
                errors:
                - errorCode: string
                  errorMessage: string
        '403':
