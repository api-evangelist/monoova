    mAccount.transactions:
      type: object
      required:
      - accountNumber
      - frequency
      properties:
        accountNumber:
          type: string
          example: '6279059700023123'
          description: 16-Digit account number that uniquely identifies the mAccount.
        frequency:
          type: string
          example: Custom
          enum:
          - Custom
          - ThisMonth
          - LastMonth
          - Today
          description: An enumeration of fixed selection types. possible values:&nbsp; Today, ThisMonth, LastMonth, Custom. A maximum of 3 months can be retrieved through Frequency = “Custom”
        startDate:
          type: string
          format: date-time
          example: '2020-04-05T00:00:00'
          description: Start date of statement when the frequency is set to custom. In ISO 8601 date-time format '2018-07-11T00:00:00'. Note that Timezone is suppressed. The default Timezone is Sydney local time. Required field when frequency is set to custom.
        endDate:
          type: string
          format: date-time
          example: '2020-04-22T00:00:00'
          description: End date of statement when the frequency is set to custom. In ISO 8601 date-time format 2018-08-11T00:00:00' . Note that Timezone is suppressed. The default Timezone is Sydney local time. Required field when frequency is set to custom.
        descending:
          type: boolean
          example: true
          default: false
          description: Default to false. true to sort the returned transaction list as descending order.
        useTime:
          type: boolean
          example: true
          default: false
          description: Default to false. true to use startDate and endDate when the frequency is set to custom.
